name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: chessreplay_test
          POSTGRES_PASSWORD: chessreplay_test
          POSTGRES_DB: chessreplay_test_admin
        ports:
          - '55432:5432'
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U chessreplay_test -d chessreplay_test_admin"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://chessreplay_test:chessreplay_test@127.0.0.1:55432/postgres
      TEST_DATABASE_URL: postgresql://chessreplay_test:chessreplay_test@127.0.0.1:55432/chessreplay_test_admin

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Check TypeScript and run health tests
        run: npm test

      - name: Run PostgreSQL integration tests
        # npm test already built the app. Use the service above instead of starting Compose.
        run: node --test test/games.integration.test.js
